<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coverpress — Game Picker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --primary: #0F7B96;
    --primary-dark: #095f78;
    --danger: #B06A00;
    --success: #0F7B96;
    --bg-light: #FAF9F6;
    --bg-paper: #E9E7E0;
    --text-dark: #16233A;
    --text-soft: #5C6478;
    --text-lighter: #8a92a3;
    --border: #C9C6BC;
    --input-bg: #fff;
    --card-bg: #fff;
    --shadow: 0 2px 8px rgba(22, 35, 58, 0.08);
    --shadow-md: 0 4px 16px rgba(22, 35, 58, 0.12);
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, var(--bg-paper) 0%, #dfdad2 100%);
    color: var(--text-dark);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

  header {
    background: linear-gradient(135deg, var(--text-dark) 0%, #0a1620 100%);
    color: #fff;
    padding: 40px 24px;
    margin: -24px -24px 32px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  header h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; }
  header p { font-size: 13px; opacity: 0.8; }

  .search-section {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }

  .search-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .search-icon { font-size: 20px; }
  .search-header h2 { font-size: 16px; font-weight: 600; }

  .search-input-wrapper {
    position: relative;
    display: flex;
    gap: 8px;
  }

  #searchInput {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: var(--input-bg);
    transition: all 0.2s;
  }

  #searchInput:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15, 123, 150, 0.1);
  }

  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 6px 6px;
    max-height: 320px;
    overflow-y: auto;
    box-shadow: var(--shadow-md);
    z-index: 10;
  }

  .result-item {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--bg-paper);
    transition: background 0.15s;
  }

  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: var(--bg-light); }

  .result-item input[type=checkbox] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .result-info { flex: 1; }
  .result-name { font-weight: 600; color: var(--text-dark); font-size: 13px; }
  .result-plats { color: var(--text-soft); font-size: 12px; margin-top: 2px; }

  .controls-section {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group label {
    font-weight: 500;
    color: var(--text-dark);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .control-group select, .control-group button {
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    background: var(--input-bg);
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .control-group select:hover, .control-group button:hover {
    border-color: var(--primary);
  }

  .apply-btn {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 12px;
    grid-column: auto / span 2;
  }

  .apply-btn:hover { background: var(--primary-dark); }
  .apply-btn:active { transform: scale(0.98); }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 24px;
    margin-bottom: 24px;
  }

  @media (max-width: 1024px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card-bg);
    border-radius: 8px;
    box-shadow: var(--shadow);
  }

  .panel-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }

  .panel-header h3 { font-size: 14px; margin: 0; }

  .queue-list {
    padding: 12px;
    max-height: 400px;
    overflow-y: auto;
  }

  .queue-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--bg-light);
    border-radius: 6px;
    margin-bottom: 8px;
    transition: background 0.15s;
  }

  .queue-item:last-child { margin-bottom: 0; }
  .queue-item:hover { background: #f0ede7; }

  .queue-badge {
    background: var(--primary);
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    flex: 0 0 auto;
  }

  .queue-name {
    flex: 1;
    font-size: 13px;
    font-weight: 500;
  }

  .queue-remove {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .queue-remove:hover { opacity: 0.8; }

  .games-table {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: var(--bg-light);
    padding: 12px;
    text-align: left;
    font-weight: 600;
    color: var(--text-dark);
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
  }

  td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  tr:hover { background: rgba(15, 123, 150, 0.02); }

  input[type=text], select {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
  }

  input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(15, 123, 150, 0.1);
  }

  .row-remove {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .row-remove:hover { opacity: 0.8; }

  .footer {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
    padding: 24px;
    background: var(--bg-light);
    border-radius: 8px;
    margin-bottom: 24px;
  }

  .btn {
    padding: 11px 24px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-save {
    background: var(--primary);
    color: #fff;
  }

  .btn-save:hover { background: var(--primary-dark); }
  .btn-save:active { transform: scale(0.98); }

  .btn-cancel {
    background: transparent;
    color: var(--text-dark);
    border: 2px solid var(--border);
  }

  .btn-cancel:hover { border-color: var(--text-dark); background: var(--bg-light); }

  .status-message {
    padding: 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  .status-message.show { display: block; }
  .status-message.error { background: rgba(176, 106, 0, 0.1); color: var(--danger); border: 1px solid var(--danger); }
  .status-message.success { background: rgba(15, 123, 150, 0.1); color: var(--primary); border: 1px solid var(--primary); }

  .empty-state {
    padding: 32px;
    text-align: center;
    color: var(--text-soft);
  }

  .empty-state p { font-size: 13px; }

  .tag {
    display: inline-block;
    background: var(--bg-light);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-soft);
  }
</style>

<header>
  <div class="container">
    <h1>🎮 Game Picker</h1>
    <p>Search, select, and configure your games for batch cover generation</p>
  </div>
</header>

<div class="container">
  <div id="statusMessage" class="status-message"></div>

  <div class="search-section">
    <div class="search-header">
      <span class="search-icon">🔍</span>
      <h2>Search RAWG</h2>
    </div>
    <div class="search-input-wrapper">
      <input type="text" id="searchInput" placeholder="e.g. Spider-Man, Elden Ring, Final Fantasy..." autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>

    <div class="controls-section">
      <div class="control-group">
        <label>Platform</label>
        <select id="bulkPlatform">
          <option value="PS5">PlayStation 5</option>
          <option value="PS4">PlayStation 4</option>
        </select>
      </div>
      <div class="control-group">
        <label>Mode</label>
        <select id="bulkMode">
          <option value="custom">📁 Custom art</option>
          <option value="auto">🌐 Auto fetched</option>
          <option value="raw">🖼️ Raw image</option>
        </select>
      </div>
      <button class="apply-btn" id="bulkApply">Apply to Selected</button>
    </div>
  </div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <span>📋</span>
        <h3>Selected Games</h3>
      </div>
      <div class="queue-list" id="queue"></div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>📝</span>
        <h3>Current games.txt</h3>
      </div>
      <div class="games-table">
        <table id="gamesTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Platform</th>
              <th>Mode</th>
              <th style="width:60px;">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn btn-save" id="saveBtn">Save to games.txt</button>
  </div>
</div>

<script>
const state = {
  queue: [],
  allGames: [],
};

function showStatus(msg, type = "info") {
  const el = document.getElementById("statusMessage");
  el.textContent = msg;
  el.className = `status-message show ${type}`;
  setTimeout(() => el.classList.remove("show"), 5000);
}

async function init() {
  await loadExistingGames();
}

async function loadExistingGames() {
  try {
    const r = await fetch("/api/games");
    const { games, error } = await r.json();
    if (error) throw new Error(error);
    state.allGames = games || [];
    renderGamesTable();
  } catch (e) {
    showStatus(`Failed to load games.txt: ${e.message}`, "error");
  }
}

const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
let searchTimeout;

searchInput.addEventListener("input", async (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if (!q) {
    searchResults.style.display = "none";
    return;
  }

  searchTimeout = setTimeout(async () => {
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const { hits, error } = await r.json();
      if (error) throw new Error(error);

      if (!hits?.length) {
        searchResults.innerHTML = '<div style="padding:16px; text-align:center; color:var(--text-soft);">No games found</div>';
        searchResults.style.display = "block";
        return;
      }

      searchResults.innerHTML = hits.map((g, idx) => {
        const plats = g.platforms?.length ? g.platforms.join(", ") : "unknown";
        return `
          <div class="result-item" data-idx="${idx}" data-name="${escapeHtml(g.name)}" data-plats="${escapeHtml(plats)}">
            <input type="checkbox" data-idx="${idx}">
            <div class="result-info">
              <div class="result-name">${escapeHtml(g.name)}</div>
              <div class="result-plats">${escapeHtml(plats)}</div>
            </div>
          </div>
        `;
      }).join("");

      // Attach click handlers via event delegation
      searchResults.querySelectorAll(".result-item").forEach(item => {
        item.addEventListener("click", (e) => {
          const checkbox = item.querySelector("input[type=checkbox]");
          checkbox.checked = !checkbox.checked;
          const name = item.dataset.name;
          if (checkbox.checked) {
            if (!state.queue.find(g => g.title === name)) {
              state.queue.push({ title: name, platform: "PS5", mode: "custom" });
            }
          } else {
            state.queue = state.queue.filter(g => g.title !== name);
          }
          renderQueue();
        });
      });

      searchResults.style.display = "block";
    } catch (e) {
      searchResults.innerHTML = `<div style="padding:16px; color:var(--danger);">Error: ${escapeHtml(e.message)}</div>`;
      searchResults.style.display = "block";
    }
  }, 300);
});

function renderQueue() {
  const queueEl = document.getElementById("queue");
  if (!state.queue.length) {
    queueEl.innerHTML = '<div class="empty-state"><p>🎮 Search and select games to get started</p></div>';
    return;
  }
  queueEl.innerHTML = state.queue.map((g, i) => {
    const modeEmoji = { custom: "📁", auto: "🌐", raw: "🖼️" }[g.mode] || "•";
    return `
      <div class="queue-item">
        <span class="queue-badge">${modeEmoji}</span>
        <div class="queue-name">${escapeHtml(g.title)}</div>
        <span class="tag">${g.platform}</span>
        <button class="queue-remove" data-idx="${i}">Remove</button>
      </div>
    `;
  }).join("");

  // Attach remove handlers via event delegation
  queueEl.querySelectorAll(".queue-remove").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx, 10);
      state.queue.splice(idx, 1);
      renderQueue();
    });
  });
}

document.getElementById("bulkApply").addEventListener("click", () => {
  if (!state.queue.length) {
    showStatus("Select games first", "error");
    return;
  }
  const platform = document.getElementById("bulkPlatform").value;
  const mode = document.getElementById("bulkMode").value;
  state.queue.forEach(g => {
    g.platform = platform;
    g.mode = mode;
  });
  renderQueue();
  renderGamesTable();
  showStatus(`Applied to ${state.queue.length} game(s)`, "success");
});

function renderGamesTable() {
  const tbody = document.querySelector("table tbody");
  const combined = [...state.allGames];
  state.queue.forEach(q => {
    if (!combined.find(g => g.title === q.title)) {
      combined.push(q);
    }
  });

  if (!combined.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><p>📝 No games yet</p></td></tr>';
    return;
  }

  tbody.innerHTML = combined.map((g, i) => {
    const modeEmoji = { custom: "📁", auto: "🌐", raw: "🖼️" }[g.mode] || "•";
    return `
      <tr>
        <td><input type="text" data-field="title" data-idx="${i}" value="${escapeHtml(g.title)}" style="width:100%;"></td>
        <td>
          <select data-field="platform" data-idx="${i}">
            <option ${g.platform === "PS5" ? "selected" : ""}>PS5</option>
            <option ${g.platform === "PS4" ? "selected" : ""}>PS4</option>
          </select>
        </td>
        <td>
          <select data-field="mode" data-idx="${i}">
            <option value="custom" ${g.mode === "custom" ? "selected" : ""}>📁 Custom</option>
            <option value="auto" ${g.mode === "auto" ? "selected" : ""}>🌐 Auto</option>
            <option value="raw" ${g.mode === "raw" ? "selected" : ""}>🖼️ Raw</option>
          </select>
        </td>
        <td><button class="row-remove" data-idx="${i}">✕</button></td>
      </tr>
    `;
  }).join("");

  tbody.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("change", e => {
      const idx = parseInt(e.target.dataset.idx, 10);
      const field = e.target.dataset.field;
      const value = e.target.value;
      if (idx < state.allGames.length) {
        state.allGames[idx][field] = value;
      } else {
        state.queue[idx - state.allGames.length][field] = value;
      }
    });
  });

  tbody.querySelectorAll(".row-remove").forEach(btn => {
    btn.addEventListener("click", () => {
      const idx = parseInt(btn.dataset.idx, 10);
      if (idx < state.allGames.length) {
        state.allGames.splice(idx, 1);
      } else {
        state.queue.splice(idx - state.allGames.length, 1);
      }
      renderGamesTable();
    });
  });
}

document.getElementById("cancelBtn").addEventListener("click", () => {
  location.reload();
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  const games = [...state.allGames, ...state.queue];
  if (!games.length) {
    showStatus("Add some games first", "error");
    return;
  }
  try {
    const r = await fetch("/api/games", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ games }),
    });
    const { ok, error } = await r.json();
    if (error) throw new Error(error);
    showStatus(`✓ Saved ${games.length} game(s). Ready to run: npm run build`, "success");
  } catch (e) {
    showStatus(`Failed to save: ${e.message}`, "error");
  }
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
  }[c]));
}

init();
</script>
