<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coverpress review queue</title>
<style>
  :root { --paper:#E9E7E0; --sheet:#FAF9F6; --ink:#16233A; --soft:#5C6478; --rule:#C9C6BC;
          --mat:#1B2233; --cyan:#0F7B96; --magenta:#A8004F; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:14px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif; }
  header { border-bottom:1px solid var(--rule); padding:18px 24px; display:flex;
           justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:19px; font-weight:600; letter-spacing:-.3px; }
  .counts { font-size:12px; color:var(--soft); }
  .counts b { color:var(--ink); font-weight:600; }
  .filters { display:flex; gap:4px; }
  .filters button { padding:7px 13px; border:1px solid var(--rule); background:transparent;
                    color:var(--soft); font:inherit; font-size:12px; cursor:pointer; border-radius:2px; }
  .filters button[data-on] { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  main { padding:24px; display:grid; gap:18px; }
  .card { background:var(--sheet); border:1px solid var(--rule); display:grid;
          grid-template-columns:minmax(320px,1.6fr) minmax(280px,1fr); }
  @media (max-width:820px) { .card { grid-template-columns:1fr; } }
  .art { background:var(--mat); padding:18px; display:flex; align-items:center; }
  .art img { width:100%; display:block; }
  .meta { padding:20px; display:flex; flex-direction:column; }
  .title { font-size:17px; font-weight:600; margin:0 0 2px; }
  .sub { font-size:12px; color:var(--soft); margin:0 0 14px; }
  .pill { display:inline-block; font-size:11px; padding:3px 8px; border-radius:2px; color:#fff; }
  .auto_approved { background:var(--cyan); }
  .needs_review { background:#B06A00; }
  .failed { background:var(--magenta); }
  ul.issues { list-style:none; padding:0; margin:0 0 16px; }
  ul.issues li { display:flex; gap:8px; font-size:12.5px; margin-bottom:9px; line-height:1.45; }
  ul.issues .dot { width:13px; height:13px; border-radius:7px; flex:0 0 auto; margin-top:2px;
                   color:#fff; font-size:9px; text-align:center; line-height:13px; }
  .warn .dot { background:#B06A00; } .fail .dot { background:var(--magenta); }
  .tweaks { border-top:1px solid var(--rule); padding-top:14px; margin-top:auto; }
  .tweaks label { display:block; font-size:11px; color:var(--soft); margin:0 0 4px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  .row > div { flex:1; }
  input[type=range] { width:100%; }
  input[type=text] { width:100%; padding:6px 8px; border:1px solid var(--rule);
                     background:#fff; font:inherit; font-size:13px; border-radius:2px; }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .actions button { flex:1; padding:9px; font:inherit; font-size:13px; cursor:pointer; border-radius:2px; }
  .approve { background:var(--ink); color:var(--paper); border:1px solid var(--ink); }
  .reject { background:transparent; color:var(--ink); border:1px solid var(--rule); }
  .rerender { background:transparent; color:var(--cyan); border:1px solid var(--cyan); }
  .decided { font-size:12px; color:var(--cyan); margin-top:12px; }
  .empty { padding:60px 24px; text-align:center; color:var(--soft); }
</style>

<header>
  <div>
    <h1>Review queue</h1>
    <div class="counts" id="counts">Loading…</div>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="list"></main>

<script>
const FILTERS = [
  ["needs_review", "Needs review"],
  ["auto_approved", "Auto-approved"],
  ["failed", "Failed"],
  ["all", "All"],
];
let state = { items: [], filter: "needs_review" };

async function load() {
  const m = await (await fetch("/api/manifest")).json();
  state.items = m.items || [];
  render();
}

async function decide(slug, decision, cfg) {
  await fetch("/api/decide", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slug, decision, cfg }),
  });
  await load();
}

function render() {
  const c = (s) => state.items.filter((i) => i.status === s).length;
  const approved = state.items.filter((i) => i.decision === "approved").length;
  document.getElementById("counts").innerHTML =
    `<b>${state.items.length}</b> covers · <b>${c("auto_approved")}</b> auto-approved · ` +
    `<b>${c("needs_review")}</b> need review · <b>${c("failed")}</b> failed · <b>${approved}</b> approved by hand`;

  document.getElementById("filters").innerHTML = FILTERS.map(
    ([k, label]) => `<button data-f="${k}" ${state.filter === k ? "data-on" : ""}>${label}</button>`
  ).join("");
  document.querySelectorAll("[data-f]").forEach((b) =>
    (b.onclick = () => { state.filter = b.dataset.f; render(); })
  );

  const shown = state.items.filter((i) => state.filter === "all" || i.status === state.filter);
  const list = document.getElementById("list");
  if (!shown.length) {
    list.innerHTML = `<p class="empty">Nothing here. Try another filter, or run <code>node pipeline.mjs print</code>.</p>`;
    return;
  }

  list.innerHTML = shown.map(card).join("");
  shown.forEach(wire);
}

function card(i) {
  const issues = (i.qc?.issues || [])
    .map((x) => `<li class="${x.level}"><span class="dot">${x.level === "fail" ? "!" : "·"}</span><span>${esc(x.msg)}</span></li>`)
    .join("");
  const cfg = i.cfg || {};
  return `<article class="card" id="c-${i.slug}">
    <div class="art">${i.files ? `<img src="/${i.files.wrap}?t=${Date.now()}" alt="">` : "<p style='color:#889'>No render</p>"}</div>
    <div class="meta">
      <h2 class="title">${esc(i.title)}</h2>
      <p class="sub">${i.platform || ""} · matched from “${esc(i.query || "")}” ·
        <span class="pill ${i.status}">${(i.status || "").replace("_", " ")}</span>
        ${i.qc ? " score " + i.qc.score : ""}</p>
      <ul class="issues">${issues || "<li style='color:#5C6478'>No issues found.</li>"}</ul>
      ${i.files ? `<div class="tweaks">
        <div class="row">
          <div><label>Title</label><input type="text" data-k="title" value="${esc(cfg.title || "")}"></div>
        </div>
        <div class="row">
          <div><label>Title size <span data-v="titleSize">${cfg.titleSize}</span> mm</label>
            <input type="range" data-k="titleSize" min="7" max="26" value="${cfg.titleSize}"></div>
          <div><label>Zoom <span data-v="zoom">${cfg.zoom}</span>×</label>
            <input type="range" data-k="zoom" min="1" max="2.5" step="0.02" value="${cfg.zoom}"></div>
        </div>
        <div class="row">
          <div><label>Shift ↔ <span data-v="offX">${cfg.offX}</span></label>
            <input type="range" data-k="offX" min="-30" max="30" value="${cfg.offX}"></div>
          <div><label>Shift ↕ <span data-v="offY">${cfg.offY}</span></label>
            <input type="range" data-k="offY" min="-30" max="30" value="${cfg.offY}"></div>
        </div>
        <div class="actions">
          <button class="rerender">Re-render</button>
          <button class="reject">Reject</button>
          <button class="approve">Approve</button>
        </div>
        ${i.decision ? `<p class="decided">Marked ${i.decision}.</p>` : ""}
      </div>` : ""}
    </div>
  </article>`;
}

function wire(i) {
  const root = document.getElementById("c-" + i.slug);
  if (!root) return;
  const patch = {};
  root.querySelectorAll("[data-k]").forEach((el) => {
    el.oninput = () => {
      const v = el.type === "range" ? Number(el.value) : el.value;
      patch[el.dataset.k] = v;
      const out = root.querySelector(`[data-v="${el.dataset.k}"]`);
      if (out) out.textContent = v;
    };
  });
  const q = (s) => root.querySelector(s);
  q(".rerender") && (q(".rerender").onclick = () => decide(i.slug, i.decision, patch));
  q(".approve") && (q(".approve").onclick = () => decide(i.slug, "approved", patch));
  q(".reject") && (q(".reject").onclick = () => decide(i.slug, "rejected", null));
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
load();
</script>
</html>
